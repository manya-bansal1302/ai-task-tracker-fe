services:
  - type: web
    name: ai-task-tracker-fe
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /auth/*
        destination: https://ai-task-tracker-be.onrender.com/auth/*
      - type: rewrite
        source: /tasks
        destination: https://ai-task-tracker-be.onrender.com/tasks
      - type: rewrite
        source: /tasks/*
        destination: https://ai-task-tracker-be.onrender.com/tasks/*
      - type: rewrite
        source: /ai/*
        destination: https://ai-task-tracker-be.onrender.com/ai/*
      - type: rewrite
        source: /*
        destination: /index.html
